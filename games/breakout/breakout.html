<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta
        name="theme-color"
        content="#050505">

    <title>Breakout | Doğu Games</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #050505;

            font-family:
                "Courier New",
                Courier,
                monospace;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        body {

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.018) 0px,
                    rgba(255,255,255,0.018) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                #050505;
        }


        /* =====================================================
           ANA CONTAINER
        ===================================================== */

        .game-container {

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 18px 20px;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        #back-btn {

            position: fixed;

            top: 28px;
            left: 26px;

            z-index: 100;

            padding:
                10px 17px;

            border:
                1px solid #19ff00;

            background:
                #050505;

            color:
                #19ff00;

            font-size:
                11px;

            font-weight:
                bold;

            letter-spacing:
                1px;

            text-decoration:
                none;

            text-transform:
                uppercase;

            transition:
                0.2s ease;
        }


        #back-btn:hover {

            color:
                #050505;

            background:
                #19ff00;

            box-shadow:
                0 0 12px
                rgba(25,255,0,0.35);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .game-title {

            text-align: center;

            margin-bottom:
                16px;

            flex-shrink: 0;
        }


        .game-title h1 {

            font-size:
                clamp(
                    30px,
                    4vw,
                    52px
                );

            line-height: 1;

            font-weight:
                bold;

            letter-spacing:
                5px;

            color:
                #19ff00;

            text-transform:
                uppercase;

            text-shadow:
                0 0 8px
                rgba(25,255,0,0.35);
        }


        .game-title h1 span {

            color:
                #f5f2dc;
        }


        /* =====================================================
           SCOREBOARD
        ===================================================== */

        #top-ui {

            width:
                min(
                    620px,
                    calc(100vw - 40px)
                );

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                10px;

            margin-bottom:
                9px;

            flex-shrink: 0;
        }


        .stat {

            min-width:
                0;

            padding:
                8px 10px;

            text-align:
                center;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );
        }


        .stat-label {

            margin-bottom:
                5px;

            font-size:
                9px;

            letter-spacing:
                4px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.42
                );
        }


        .stat-value {

            font-size:
                20px;

            line-height:
                1;

            font-weight:
                bold;

            color:
                #19ff00;

            text-shadow:
                0 0 8px
                rgba(
                    25,
                    255,
                    0,
                    0.45
                );
        }


        /* =====================================================
           WAVE
        ===================================================== */

        #level-display {

            margin-bottom:
                8px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            font-size:
                9px;

            letter-spacing:
                5px;

            text-transform:
                uppercase;

            flex-shrink: 0;
        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        .game-wrapper {

            position:
                relative;

            width:
                min(
                    600px,
                    calc(100vw - 40px),
                    calc(100vh - 235px)
                );

            aspect-ratio:
                1 / 1;

            flex-shrink: 1;

            min-height:
                0;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;
        }


        canvas {

            display:
                block;

            width:
                100%;

            height:
                100%;

            background:
                repeating-linear-gradient(
                    0deg,
                    rgba(
                        255,
                        255,
                        255,
                        0.018
                    ) 0px,
                    rgba(
                        255,
                        255,
                        255,
                        0.018
                    ) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                #050805;

            border:
                1px solid
                #19ff00;

            box-shadow:
                0 0 0 1px
                rgba(
                    25,
                    255,
                    0,
                    0.08
                ),

                0 0 15px
                rgba(
                    25,
                    255,
                    0,
                    0.05
                );

            touch-action:
                none;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {

            position:
                absolute;

            top:
                50%;

            left:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            width:
                100%;

            text-align:
                center;

            z-index:
                20;

            pointer-events:
                none;

            transition:
                opacity
                0.25s
                ease;
        }


        #message.hidden {

            opacity:
                0;
        }


        #message-title {

            font-size:
                clamp(
                    28px,
                    4vw,
                    48px
                );

            font-weight:
                bold;

            letter-spacing:
                5px;

            color:
                #f5f2dc;

            text-shadow:
                0 0 8px
                rgba(
                    245,
                    242,
                    220,
                    0.25
                );
        }


        #message-subtitle {

            margin-top:
                14px;

            font-size:
                clamp(
                    9px,
                    1.4vw,
                    13px
                );

            font-weight:
                bold;

            letter-spacing:
                4px;

            color:
                #19ff00;

            text-transform:
                uppercase;

            animation:
                arcadeBlink
                1.1s
                steps(2, start)
                infinite;
        }


        @keyframes arcadeBlink {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 700px) {

            .game-container {

                padding:
                    15px 12px;
            }


            #back-btn {

                top: 15px;
                left: 15px;

                padding:
                    8px 11px;

                font-size:
                    9px;
            }


            .game-title {

                margin-bottom:
                    10px;
            }


            .game-title h1 {

                font-size:
                    30px;

                letter-spacing:
                    4px;
            }


            #top-ui {

                width:
                    calc(100vw - 30px);

                gap:
                    6px;

                margin-bottom:
                    6px;
            }


            .stat {

                padding:
                    7px 4px;
            }


            .stat-label {

                font-size:
                    7px;

                letter-spacing:
                    2px;
            }


            .stat-value {

                font-size:
                    17px;
            }


            #level-display {

                margin-bottom:
                    6px;

                font-size:
                    8px;

                letter-spacing:
                    3px;
            }


            .game-wrapper {

                width:
                    min(
                        calc(100vw - 30px),
                        calc(100vh - 185px)
                    );
            }
        }


        /* =====================================================
           VERY SHORT SCREEN
        ===================================================== */

        @media (max-height: 650px) and (min-width: 701px) {

            .game-title {

                margin-bottom:
                    8px;
            }


            .game-title h1 {

                font-size:
                    32px;
            }


            #top-ui {

                margin-bottom:
                    5px;
            }


            .stat {

                padding:
                    5px 8px;
            }


            .stat-label {

                font-size:
                    7px;
            }


            .stat-value {

                font-size:
                    16px;
            }


            #level-display {

                margin-bottom:
                    4px;
            }


            .game-wrapper {

                width:
                    min(
                        500px,
                        calc(100vw - 40px),
                        calc(100vh - 145px)
                    );
            }
        }


    </style>

</head>


<body>


    <!-- =====================================================
         GERİ DÖN
    ===================================================== -->

    <a
        href="../../index.html"
        id="back-btn"
    >
        ← ANA SAYFA
    </a>


    <main class="game-container">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div class="game-title">

            <h1>
                <span>BREAK</span>OUT
            </h1>

        </div>


        <!-- =================================================
             SCORE
        ================================================== -->

        <div id="top-ui">


            <div class="stat">

                <div class="stat-label">
                    SCORE
                </div>

                <div
                    class="stat-value"
                    id="score"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    BEST
                </div>

                <div
                    class="stat-value"
                    id="best"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    LIVES
                </div>

                <div
                    class="stat-value"
                    id="lives"
                >
                    3
                </div>

            </div>


        </div>


        <!-- =================================================
             WAVE
        ================================================== -->

        <div id="level-display">
            WAVE 01
        </div>


        <!-- =================================================
             GAME
        ================================================== -->

        <div class="game-wrapper">

            <canvas
                id="gameCanvas"
            ></canvas>


            <div id="message">

                <div id="message-title">
                    BREAKOUT
                </div>

                <div id="message-subtitle">
                    TAP TO START
                </div>

            </div>

        </div>


    </main>


    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         GAME
    ===================================================== -->

    <script src="breakout.js"></script>


</body>

</html>
