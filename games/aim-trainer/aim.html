<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aim Trainer | Doğu Games</title>

    <style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #050505;
    color: #f5f5dc;

    font-family:
        "Courier New",
        monospace;

    overflow: hidden;
}


/* =================================
   MAIN WRAPPER
================================= */

.aim-wrapper {

    width: min(
        1000px,
        calc(100vw - 40px)
    );

    height: 100vh;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

}


/* =================================
   HEADER
================================= */

.aim-header {

    height: 105px;

    flex-shrink: 0;

    display: grid;

    grid-template-columns:
        170px
        1fr
        auto;

    align-items: center;

    gap: 20px;

    border-bottom:
        1px solid #333;

}


/* =================================
   BACK BUTTON
================================= */

.back-btn {

    display: inline-block;

    width: max-content;

    padding:
        12px 16px;

    border:
        2px solid #333;

    color:
        #f5f5dc;

    text-decoration:
        none;

    font-weight:
        bold;

}

.back-btn:hover {

    color:
        #39ff14;

    border-color:
        #39ff14;

}


/* =================================
   TITLE
================================= */

h1 {

    margin: 0;

    text-align: center;

    font-size:
        clamp(25px, 3vw, 38px);

    letter-spacing:
        4px;

}

h1 span {

    color:
        #39ff14;

}


/* =================================
   STATS
================================= */

.aim-stats {

    display:
        flex;

    gap:
        8px;

}


.stat {

    width:
        72px;

    padding:
        8px 5px;

    border:
        2px solid #333;

    text-align:
        center;

    font-size:
        10px;

}


.stat-value {

    display:
        block;

    margin-top:
        5px;

    color:
        #39ff14;

    font-size:
        16px;

}


/* =================================
   GAME AREA
================================= */

#aim-game {

    position:
        relative;

    width:
        100%;

    /*
        Header 105px
        Footer yaklaşık 35px
        Kalan alan otomatik
    */

    flex:
        1;

    min-height:
        0;

    margin-top:
        22px;

    margin-bottom:
        12px;

    overflow:
        hidden;

    border:
        2px solid #333;

    background:

        radial-gradient(
            circle,
            rgba(25, 25, 25, 0.4) 1px,
            transparent 1px
        );

    background-size:
        6px 6px;

    cursor:
        crosshair;

}


/* =================================
   TARGET
================================= */

#target {

    position:
        absolute;

    width:
        70px;

    height:
        70px;

    transform:
        translate(-50%, -50%);

    display:
        none;

    border:
        3px solid #050505;

    border-radius:
        50%;

    cursor:
        crosshair;

    z-index:
        10;

    background:
        #fff;

    box-shadow:

        0 0 0 2px #111,

        0 0 12px
        rgba(255, 30, 30, .75),

        0 0 25px
        rgba(255, 30, 30, .25);

}


/* =================================
   DART BOARD
================================= */

.target-board {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    border-radius:
        50%;

    background:

        radial-gradient(
            circle,

            #ffffff 0%,
            #ffffff 12%,

            #ef2b24 12%,
            #ef2b24 28%,

            #ffffff 28%,
            #ffffff 43%,

            #ef2b24 43%,
            #ef2b24 60%,

            #ffffff 60%,
            #ffffff 76%,

            #ef2b24 76%,
            #ef2b24 100%
        );

}


/* =================================
   DART
================================= */

.dart {

    position:
        absolute;

    width:
        58%;

    height:
        12%;

    right:
        -8%;

    top:
        20%;

    transform:
        rotate(-45deg);

    transform-origin:
        100% 50%;

    z-index:
        3;

    pointer-events:
        none;

}


.dart-shaft {

    position:
        absolute;

    width:
        72%;

    height:
        16%;

    left:
        4%;

    top:
        42%;

    background:
        #087fc9;

    border-radius:
        5px;

}


.dart-tip {

    position:
        absolute;

    left:
        0;

    top:
        28%;

    width:
        20%;

    height:
        44%;

    background:
        #0b78b8;

    clip-path:
        polygon(
            0 50%,
            100% 0,
            100% 100%
        );

}


.dart-flight {

    position:
        absolute;

    right:
        0;

    top:
        0;

    width:
        34%;

    height:
        100%;

    background:
        #12bde9;

    clip-path:
        polygon(
            0 50%,
            30% 0,
            100% 12%,
            100% 88%,
            30% 100%
        );

}


/* =================================
   HIT ANIMATION
================================= */

#target.hit {

    animation:
        targetHit
        .14s
        ease-out;

}


@keyframes targetHit {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1);

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(.88);

    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

    }

}


/* =================================
   START SCREEN
================================= */

#start-screen {

    position:
        absolute;

    inset:
        0;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    background:
        rgba(5, 5, 5, .94);

    z-index:
        50;

    text-align:
        center;

}


#start-screen h2 {

    margin:
        0 0 18px;

    color:
        #39ff14;

    font-size:
        clamp(24px, 3vw, 34px);

    letter-spacing:
        3px;

}


#start-screen p {

    margin:
        0 0 22px;

    line-height:
        1.8;

    color:
        #aaa;

}


#start-btn {

    padding:
        13px 28px;

    background:
        transparent;

    border:
        2px solid #39ff14;

    color:
        #39ff14;

    font-family:
        "Courier New",
        monospace;

    font-weight:
        bold;

    cursor:
        pointer;

}


#start-btn:hover {

    background:
        #39ff14;

    color:
        #050505;

}


/* =================================
   FOOTER
================================= */

.aim-footer {

    height:
        35px;

    flex-shrink:
        0;

    text-align:
        center;

    color:
        #777;

    font-size:
        11px;

    letter-spacing:
        2px;

}


/* =================================
   RESPONSIVE
================================= */

@media (max-width: 850px) {

    .aim-wrapper {

        width:
            calc(100vw - 20px);

    }


    .aim-header {

        height:
            90px;

        grid-template-columns:
            auto 1fr;

    }


    .aim-header h1 {

        order:
            1;

    }


    .back-btn {

        order:
            0;

    }


    .aim-stats {

        grid-column:
            1 / -1;

        justify-content:
            center;

        display:
            none;

    }

}


@media (max-height: 650px) {

    .aim-header {

        height:
            80px;

    }


    #aim-game {

        margin-top:
            12px;

        margin-bottom:
            8px;

    }


    .aim-footer {

        height:
            25px;

    }

}

</style>

</head>


<body>


<div class="aim-wrapper">


    <!-- ============================
         HEADER
    ============================= -->

    <header class="aim-header">


        <a
            href="../index.html"
            class="back-btn"
        >
            ← ANA SAYFA
        </a>


        <h1>
            AIM TRAINER
            <span>///</span>
        </h1>


        <div class="aim-stats">


            <div class="stat">

                HITS

                <span
                    class="stat-value"
                    id="hits"
                >
                    0
                </span>

            </div>


            <div class="stat">

                TIME

                <span
                    class="stat-value"
                    id="time"
                >
                    30
                </span>

            </div>


            <div class="stat">

                MISSES

                <span
                    class="stat-value"
                    id="misses"
                >
                    0
                </span>

            </div>


            <div class="stat">

                SCORE

                <span
                    class="stat-value"
                    id="score"
                >
                    0
                </span>

            </div>


        </div>

    </header>


    <!-- ============================
         GAME
    ============================= -->

    <main id="aim-game">


        <!-- START / GAME OVER -->

        <div id="start-screen">


            <h2>
                AIM TRAINER
            </h2>


            <p>
                HIT AS MANY TARGETS AS POSSIBLE
            </p>


            <button
                id="start-btn"
            >
                START GAME
            </button>


        </div>


        <!-- ============================
             DART TARGET
        ============================= -->

        <div id="target">


            <div class="target-board"></div>


            <div class="dart">

                <div class="dart-tip"></div>

                <div class="dart-shaft"></div>

                <div class="dart-flight"></div>

            </div>


        </div>


    </main>


    <div class="aim-footer">

        HIT THE TARGETS BEFORE TIME RUNS OUT

    </div>


</div>


<script src="aim.js"></script>


</body>

</html>
