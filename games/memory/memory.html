<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memory | Doğu Games</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #050505;

            color: #f5f5dc;

            font-family:
                "Courier New",
                monospace;
        }


        body {
            min-height: 100vh;
        }


        button,
        a {
            font-family:
                "Courier New",
                monospace;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .memory-wrapper {

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 30px 20px 40px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .memory-header {

            width: min(900px, 100%);

            display: grid;

            grid-template-columns:
                1fr
                auto
                1fr;

            align-items: center;

            gap: 25px;

            padding-bottom: 22px;

            border-bottom:
                2px solid #292929;

            margin-bottom: 35px;

        }


        .back-btn {

            justify-self: start;

            display: inline-block;

            padding: 10px 14px;

            border:
                2px solid #333;

            color: #f5f5dc;

            text-decoration: none;

            font-size: 11px;

            letter-spacing: 1px;

            transition:
                0.15s;

        }


        .back-btn:hover {

            color: #39ff14;

            border-color:
                #39ff14;

        }


        .memory-title {

            margin: 0;

            text-align: center;

            white-space: nowrap;

            font-size: 30px;

            letter-spacing: 5px;

            color: #f5f5dc;

            text-shadow:
                3px 3px 0 #151515;

        }


        .memory-title span {

            color: #39ff14;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .memory-stats {

            justify-self: end;

            display: flex;

            gap: 8px;

        }


        .stat {

            min-width: 70px;

            padding: 8px 10px;

            border:
                2px solid #333;

            text-align: center;

            font-size: 9px;

            letter-spacing: 1px;

        }


        .stat-value {

            display: block;

            margin-top: 5px;

            color: #39ff14;

            font-size: 16px;

            font-weight: bold;

        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        .game-area {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        /* =====================================================
           MEMORY BOARD
        ===================================================== */

        .memory-board {

            width: min(560px, 90vw);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .memory-card {

            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            padding: 0;

            border:
                3px solid #333;

            background: #101010;

            cursor: pointer;

            appearance: none;

            overflow: hidden;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;

        }


        .memory-card:hover {

            border-color:
                #39ff14;

        }


        .memory-card:focus {

            outline: none;

        }


        /* =====================================================
           CARD FRONT / BACK
        ===================================================== */

        .card-front,
        .card-back {

            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* CLOSED */

        .card-front {

            background:
                repeating-linear-gradient(
                    45deg,
                    #0b0b0b,
                    #0b0b0b 4px,
                    #111 4px,
                    #111 8px
                );

        }


        .card-front::after {

            content: "?";

            color: #39ff14;

            font-size: 42px;

            font-weight: bold;

        }


        /* OPEN */

        .card-back {

            display: none;

            background: #080808;

        }


        .memory-card.flipped
        .card-front {

            display: none;

        }


        .memory-card.flipped
        .card-back {

            display: flex;

        }


        /* =====================================================
           PIXEL ICON
        ===================================================== */

        .pixel-icon {

            width: 72px;

            height: 72px;

            image-rendering:
                pixelated;

            image-rendering:
                crisp-edges;

        }


        /* =====================================================
           MATCHED
        ===================================================== */

        .memory-card.matched {

            border-color:
                #39ff14;

            box-shadow:
                0 0 8px #39ff14,
                0 0 18px
                rgba(
                    57,
                    255,
                    20,
                    0.35
                );

            animation:
                matchFlash
                0.3s
                steps(2);

        }


        @keyframes matchFlash {

            0% {
                transform:
                    scale(1);
            }

            50% {
                transform:
                    scale(1.06);
            }

            100% {
                transform:
                    scale(1);
            }

        }


        /* =====================================================
           CONTROLS
        ===================================================== */

        .memory-controls {

            margin-top: 28px;

            text-align: center;

        }


        .memory-controls p {

            margin:
                0 0 18px;

            color: #666;

            font-size: 10px;

            letter-spacing: 2px;

        }


        .memory-btn {

            padding:
                11px 24px;

            border:
                2px solid #39ff14;

            background:
                #050505;

            color:
                #39ff14;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1px;

            cursor: pointer;

            transition:
                0.15s;

        }


        .memory-btn:hover {

            background:
                #39ff14;

            color:
                #050505;

        }


        /* =====================================================
           WIN SCREEN
        ===================================================== */

        .win-screen {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.92
                );

        }


        .win-box {

            width:
                min(
                    400px,
                    90vw
                );

            padding: 35px;

            border:
                3px solid #39ff14;

            background:
                #050505;

            text-align: center;

            box-shadow:
                0 0 25px
                rgba(
                    57,
                    255,
                    20,
                    0.15
                );

        }


        .win-box h2 {

            margin:
                0 0 20px;

            color:
                #39ff14;

            font-size:
                28px;

            letter-spacing:
                4px;

        }


        .win-box p {

            color:
                #f5f5dc;

            font-size:
                12px;

            line-height:
                2;

        }


        .win-box strong {

            color:
                #39ff14;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .memory-wrapper {

                padding:
                    18px 12px 30px;

            }


            .memory-header {

                grid-template-columns:
                    1fr;

                justify-items:
                    center;

                gap: 15px;

            }


            .back-btn {

                justify-self:
                    center;

            }


            .memory-title {

                font-size:
                    25px;

                order:
                    -1;

            }


            .memory-stats {

                justify-self:
                    center;

            }


            .memory-board {

                width:
                    min(
                        500px,
                        94vw
                    );

                gap:
                    7px;

            }


            .pixel-icon {

                width:
                    55px;

                height:
                    55px;

            }

        }

    </style>

</head>


<body>


    <div class="memory-wrapper">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="memory-header">


            <a
                href="../index.html"
                class="back-btn"
            >
                ← ANA SAYFA
            </a>


            <h1 class="memory-title">

                MEMORY

                <span>///</span>

            </h1>


            <div class="memory-stats">


                <div class="stat">

                    MOVES

                    <span
                        class="stat-value"
                        id="moves"
                    >
                        0
                    </span>

                </div>


                <div class="stat">

                    TIME

                    <span
                        class="stat-value"
                        id="timer"
                    >
                        00:00
                    </span>

                </div>


                <div class="stat">

                    BEST

                    <span
                        class="stat-value"
                        id="best-score"
                    >
                        --
                    </span>

                </div>


            </div>


        </header>


        <!-- =================================================
             GAME
        ================================================== -->

        <main class="game-area">


            <div
                id="memory-board"
                class="memory-board"
            >
            </div>


            <div
                class="memory-controls"
            >

                <p>
                    FIND ALL MATCHING PAIRS
                </p>


                <button
                    id="restart-btn"
                    class="memory-btn"
                    type="button"
                >
                    RESTART
                </button>

            </div>


        </main>


    </div>


    <!-- =====================================================
         WIN SCREEN
    ====================================================== -->

    <div
        id="win-screen"
        class="win-screen"
    >

        <div class="win-box">


            <h2>
                YOU WIN!
            </h2>


            <p>

                MEMORY COMPLETE!

                <br>

                MOVES:
                <strong
                    id="final-moves"
                >
                    0
                </strong>

                <br>

                TIME:
                <strong
                    id="final-time"
                >
                    00:00
                </strong>

                <br>

                BEST:
                <strong
                    id="final-best"
                >
                    --
                </strong>

            </p>


            <button
                id="win-restart"
                class="memory-btn"
                type="button"
            >
                PLAY AGAIN
            </button>


        </div>

    </div>


    <script src="memory.js"></script>

</body>

</html>
