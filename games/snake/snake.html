<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Snake - Doğu Games</title>

    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    background: #111;

    color: #f5f5dc;

    font-family: "Courier New", monospace;
}


.game-wrapper {
    width: min(520px, 92vw);

    max-height: 95vh;

    text-align: center;
}


/* =========================
   TITLE
========================= */

h1 {
    margin-bottom: 12px;

    font-size: 26px;

    letter-spacing: 5px;
}

h1 span {
    color: #39ff14;
}


/* =========================
   GAME INFO
========================= */

.game-info {
    display: flex;

    justify-content: space-between;

    margin-bottom: 10px;

    padding: 9px 12px;

    border: 3px solid #444;

    background: #080808;

    font-size: 13px;
}

.score {
    color: #39ff14;
}


/* =========================
   CANVAS
========================= */

canvas {
    display: block;

    width: min(440px, 85vw);
    height: min(440px, 85vw);

    margin: 0 auto;

    background: #050505;

    border: 4px solid #f5f5dc;

    image-rendering: pixelated;
}


/* =========================
   CONTROLS
========================= */

.controls {
    margin-top: 10px;

    color: #777;

    font-size: 11px;

    line-height: 1.7;
}


/* =========================
   BACK BUTTON
========================= */

.back-btn {
    display: inline-block;

    margin-top: 10px;

    padding: 9px 14px;

    color: #f5f5dc;

    background: transparent;

    border: 2px solid #444;

    text-decoration: none;

    font-size: 11px;
}

.back-btn:hover {
    color: #39ff14;

    border-color: #39ff14;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .game-wrapper {
        width: 94vw;
    }

    h1 {
        font-size: 20px;
    }

    canvas {
        width: 82vw;
        height: 82vw;
    }

    .game-info {
        font-size: 10px;
    }

    .controls {
        font-size: 9px;
    }

    .back-btn {
        font-size: 9px;
    }

}

    </style>

</head>


<body>


    <div class="game-wrapper">


        <h1>
            SNAKE <span>///</span>
        </h1>


        <div class="game-info">

            <span>
                SCORE:
                <strong class="score" id="score">
                    0
                </strong>
            </span>

            <span>
                HIGH SCORE:
                <strong id="high-score">
                    0
                </strong>
            </span>

        </div>


        <canvas
            id="gameCanvas"
            width="400"
            height="400">
        </canvas>


        <div class="controls">

            ↑ ↓ ← → AND W, A, S, D&nbsp; MOVE

            <br>

            SPACE&nbsp; START / RESTART

        </div>


        <a
            href="../index.html"
            class="back-btn"
        >
            ← ANA SAYFAYA DÖN
        </a>


    </div>


    <script src="snake.js"></script>

</body>

</html>
